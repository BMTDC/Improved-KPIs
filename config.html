<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>KPI settings</title>
    <script src="tableau.extensions.1.latest.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body onload="initializeConfig()" class="m-0 bg-white font-[Calibri,Arial,sans-serif] text-sm text-gray-800">
    <form id="settingsForm" class="flex flex-col gap-3 p-4">
        <h1 class="m-0 text-base font-bold uppercase tracking-wide text-gray-600">KPI settings</h1>

        <label class="flex flex-col gap-1">
            <span class="text-xs font-medium uppercase tracking-wide text-gray-500">Title (empty = field name)</span>
            <input id="title" type="text" class="rounded-md border border-gray-300 px-2 py-1 focus:border-gray-500 focus:outline-none">
        </label>

        <div class="grid grid-cols-2 gap-3">
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium uppercase tracking-wide text-gray-500">Aggregation</span>
                <select id="aggregation" class="rounded-md border border-gray-300 px-2 py-1 focus:border-gray-500 focus:outline-none">
                    <option value="sum">Sum</option>
                    <option value="avg">Average</option>
                    <option value="min">Min</option>
                    <option value="max">Max</option>
                </select>
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium uppercase tracking-wide text-gray-500">Decimals</span>
                <select id="decimals" class="rounded-md border border-gray-300 px-2 py-1 focus:border-gray-500 focus:outline-none">
                    <option value="auto">Auto</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium uppercase tracking-wide text-gray-500">Prefix</span>
                <input id="prefix" type="text" class="rounded-md border border-gray-300 px-2 py-1 focus:border-gray-500 focus:outline-none">
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium uppercase tracking-wide text-gray-500">Suffix</span>
                <input id="suffix" type="text" class="rounded-md border border-gray-300 px-2 py-1 focus:border-gray-500 focus:outline-none">
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium uppercase tracking-wide text-gray-500">Default level</span>
                <select id="defaultLevel" class="rounded-md border border-gray-300 px-2 py-1 focus:border-gray-500 focus:outline-none">
                    <option value="0">Latest</option>
                    <option value="1">Year</option>
                    <option value="2">Month</option>
                    <option value="3">Week</option>
                    <option value="4">Day</option>
                </select>
            </label>
            <label class="flex flex-col gap-1">
                <span class="text-xs font-medium uppercase tracking-wide text-gray-500">Accent colour</span>
                <input id="accentColor" type="color" class="h-8 w-full cursor-pointer rounded-md border border-gray-300 bg-white p-0.5">
            </label>
        </div>

        <label class="flex items-center gap-2">
            <input id="showDelta" type="checkbox" class="h-4 w-4 accent-gray-700">
            <span>Show change vs previous period</span>
        </label>
        <label class="flex items-center gap-2">
            <input id="higherIsBetter" type="checkbox" class="h-4 w-4 accent-gray-700">
            <span>Higher is better (green for increases)</span>
        </label>
        <label class="flex items-center gap-2">
            <input id="showSlider" type="checkbox" class="h-4 w-4 accent-gray-700">
            <span>Show date slider</span>
        </label>

        <div id="errorBox" class="hidden rounded-md bg-red-50 px-2 py-1 text-xs text-red-700"></div>

        <div class="mt-2 flex justify-between gap-2">
            <button id="resetBtn" type="button" class="cursor-pointer rounded-md border border-gray-300 bg-white px-3 py-1.5 text-gray-700 hover:bg-gray-100">Reset</button>
            <div class="flex gap-2">
                <button id="cancelBtn" type="button" class="cursor-pointer rounded-md border border-gray-300 bg-white px-3 py-1.5 text-gray-700 hover:bg-gray-100">Cancel</button>
                <button id="saveBtn" type="submit" class="cursor-pointer rounded-md border border-gray-800 bg-gray-800 px-3 py-1.5 font-semibold text-white hover:bg-gray-700">Save</button>
            </div>
        </div>
    </form>
    <script src="config.js"></script>
</body>
</html>
